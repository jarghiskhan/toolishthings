<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolish Programs - Program Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/colors.css" rel="stylesheet">
    <link href="../css/common.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="editor-layout">
        <aside class="editor-sidebar" id="editorSidebar">
            <header class="sidebar-header">
                <h1 class="sidebar-title">
                    <i class="fas fa-file-alt"></i>
                    Toolish Programs
                </h1>
                <p class="sidebar-subtitle">Create printable event programs</p>
            </header>

            <section class="sidebar-section project-section">
                <label class="form-label" for="projectSelect">Program</label>
                <div class="project-controls">
                    <select id="projectSelect" class="form-select form-select-sm"></select>
                    <button type="button" id="newProjectBtn" class="btn btn-sm btn-outline-primary" title="New program">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button type="button" id="deleteProjectBtn" class="btn btn-sm btn-outline-danger" title="Delete program">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <label class="form-label mt-2" for="projectName">Program name</label>
                <input type="text" id="projectName" class="form-control form-control-sm" placeholder="Sunday Service">
            </section>

            <section class="sidebar-section">
                <div class="add-field-buttons">
                    <button type="button" id="addTextBtn" class="btn btn-primary btn-sm">
                        <i class="fas fa-font"></i> Add Text
                    </button>
                    <button type="button" id="addImageBtn" class="btn btn-secondary btn-sm">
                        <i class="fas fa-image"></i> Add Image
                    </button>
                </div>
                <p class="placement-hint" id="placementHint" hidden>Click on the page to place the field</p>
            </section>

            <section class="sidebar-section field-editors" id="fieldEditors">
                <p class="empty-fields-msg" id="emptyFieldsMsg">No fields yet. Add a text or image field above.</p>
            </section>

            <section class="sidebar-section sidebar-actions">
                <button type="button" id="exportBtn" class="btn btn-outline-secondary btn-sm w-100 mb-2">
                    <i class="fas fa-download"></i> Export Template
                </button>
                <label class="btn btn-outline-secondary btn-sm w-100 mb-0" for="importInput">
                    <i class="fas fa-upload"></i> Import Template
                </label>
                <input type="file" id="importInput" accept=".json,application/json" hidden>
            </section>
        </aside>

        <main class="editor-main">
            <div class="editor-toolbar">
                <button type="button" id="printBtn" class="btn btn-primary btn-sm">
                    <i class="fas fa-print"></i> Print
                </button>
                <span class="save-status" id="saveStatus">Saved</span>
                <span class="storage-warning text-warning small" id="storageWarning" hidden></span>
            </div>

            <div class="canvas-wrapper">
                <div class="program-canvas" id="programCanvas" aria-label="Program page canvas">
                    <div class="canvas-fold-line" aria-hidden="true"></div>
                    <div class="canvas-fields" id="canvasFields"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/shared-navbar.js"></script>
    <script src="app.js"></script>
</body>
</html>
