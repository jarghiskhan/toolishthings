<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toolish Gains - Workout Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/colors.css" rel="stylesheet">
    <link href="../css/common.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div id="timer-flash-overlay" class="timer-flash-overlay" aria-hidden="true"></div>

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <h1 class="display-5 fw-bold">Toolish Gains - Workout Tracker</h1>
        </header>

        <ul class="nav nav-tabs program-tabs mb-4" id="program-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button type="button" class="nav-link active" data-program="toolish" onclick="selectProgram('toolish')">Toolish Gains</button>
            </li>
            <li class="nav-item" role="presentation">
                <button type="button" class="nav-link" data-program="bodyweight" onclick="selectProgram('bodyweight')">Athletic Training</button>
            </li>
        </ul>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title" id="session-card-title">Select Workout Day</h5>
                        <div id="session-buttons" class="btn-group w-100 flex-wrap" role="group"></div>
                    </div>
                </div>

                <div id="warmup-card" class="card mb-3 d-none">
                    <div class="card-body">
                        <h5 class="card-title">Warm-up</h5>
                        <label for="warmup-select" class="form-label small text-muted">Choose your warm-up</label>
                        <select id="warmup-select" class="form-select mb-3" onchange="onWarmupChange()"></select>
                        <div class="warmup-timer-display text-center display-6 fw-bold mb-3" id="warmup-timer-display">10:00</div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary" id="warmup-start-btn" onclick="toggleWarmupTimer()">Start</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resetWarmupTimer()">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Actions</h5>
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" onclick="saveWorkout()">Save Progress</button>
                            <button class="btn btn-warning" onclick="clearAllChecks()">Clear Check</button>
                            <button class="btn btn-info" onclick="exportData()">Export Data</button>
                            <a href="repCounter/index.html" class="btn btn-outline-primary">
                                <i class="fas fa-dumbbell me-2"></i>Rep Counter
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Current Workout</h5>
                        <div id="workout-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="exercise-template">
        <div class="exercise-item mb-4" data-exercise-type="reps">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="exercise-name mb-0"></h5>
                        <select class="form-select form-select-sm exercise-variant" style="width: auto;"></select>
                    </div>
                    <div class="exercise-details small text-muted mb-2"></div>
                    <div class="personal-records small text-success mb-3">
                        <div class="pr-weight-row">Best Weight: <span class="best-weight">None</span></div>
                        <div>Best Reps: <span class="best-reps">None</span></div>
                        <div>Last completed: <span class="last-done">Never</span></div>
                    </div>
                    <div class="sets-container"></div>
                    <div class="mt-2 add-set-row">
                        <button class="btn btn-sm btn-outline-primary add-set-btn" onclick="addSetToExercise(this)">Add Set</button>
                    </div>
                    <div class="mt-3 ratings-row">
                        <div class="row g-3 align-items-center">
                            <div class="col-auto">
                                <label class="form-label mb-0">Last time soreness:</label>
                            </div>
                            <div class="col-auto">
                                <select class="form-select form-select-sm soreness-rating">
                                    <option value="0">None</option>
                                    <option value="1">Mild</option>
                                    <option value="2">Moderate</option>
                                    <option value="3">Severe</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label mb-0">Exertion:</label>
                            </div>
                            <div class="col-auto">
                                <select class="form-select form-select-sm exertion-rating">
                                    <option value="1">Very Easy</option>
                                    <option value="2">Easy</option>
                                    <option value="3">Moderate</option>
                                    <option value="4">Hard</option>
                                    <option value="5">Very Hard</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 text-center">
                        <button class="btn btn-outline-primary btn-sm next-exercise-btn" onclick="goToNextExercise(this)">
                            <i class="fas fa-arrow-down"></i> Next Exercise
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="set-template">
        <div class="set-row row g-2 mb-2 align-items-center">
            <div class="col-auto">
                <label class="col-form-label col-form-label-sm set-label">Set:</label>
            </div>
            <div class="col-auto weight-col">
                <input type="number" class="form-control form-control-sm weight-input" placeholder="Weight (kg)">
            </div>
            <div class="col-auto">
                <input type="number" class="form-control form-control-sm reps-input" placeholder="Reps">
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-success complete-set" onclick="markSetComplete(this)">✓</button>
            </div>
        </div>
    </template>

    <template id="timed-set-template">
        <div class="set-row timed-set-row row g-2 mb-2 align-items-center" data-duration-seconds="60">
            <div class="col-auto">
                <label class="col-form-label col-form-label-sm set-label">Set:</label>
            </div>
            <div class="col-auto">
                <span class="timer-countdown badge bg-secondary fs-6">1:00</span>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-primary timer-start-btn" onclick="toggleSetTimer(this)">Start</button>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-secondary timer-reset-btn" onclick="resetSetTimer(this)">Reset</button>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-success complete-set" onclick="markSetComplete(this)">✓</button>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="workoutData.js"></script>
    <script src="athleticTrainingData.js"></script>
    <script src="app.js"></script>
    <script src="../js/shared-navbar.js"></script>
</body>
</html>
